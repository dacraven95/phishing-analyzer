services:
  phish-analyzer-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: phish-analyzer-api:latest
    container_name: phish-analyzer-api
    ports:
      - "${PHISH_BIND_IP:-0.0.0.0}:8000:8000"
    restart: unless-stopped
    init: true
    shm_size: "256m"
    security_opt:
      - no-new-privileges:true
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in your .env file}
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      THREAT_INTEL_ENABLED: ${THREAT_INTEL_ENABLED:-false}
      TRUSTED_AUTH_SERVERS: ${TRUSTED_AUTH_SERVERS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./phish_analyzer/config:/app/phish_analyzer/config
      - ./phish_analyzer/yara_rules:/app/phish_analyzer/yara_rules
